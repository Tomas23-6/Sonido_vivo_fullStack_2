<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrito de Compras - Sonido Vivo</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="navbar">
    <a href="index.html" class="nav-brand">
      <span class="brand-icon">🎸</span>
      <h1>SONIDO VIVO</h1>
    </a>
    <button class="menu-toggle" id="menu-toggle">☰</button>
    <nav>
      <ul class="nav-list" id="nav-list">
        <li><a href="index.html" class="nav-link">Inicio</a></li>
        <li><a href="catalogo.html" class="nav-link">Catálogo</a></li>
        <li id="nav-session"></li>
        <li>
          <a href="carrito.html" class="cart-icon-btn">
            🛒 <span class="cart-badge" id="cart-badge">0</span>
          </a>
        </li>
      </ul>
    </nav>
  </header>

  <main>
    <h2 class="section-title">Mi Carrito de Compras</h2>

    <div id="carrito-vacio" style="display:none; text-align:center; padding:50px;">
      <p style="font-size:1.2rem; color:var(--text-muted); margin-bottom:20px;">Tu carrito está actualmente vacío.</p>
      <a href="catalogo.html" class="btn-primary">Explorar Catálogo</a>
    </div>

    <div id="carrito-tabla-wrapper">
      <table class="cart-table">
        <thead>
          <tr>
            <th>Producto</th>
            <th>Precio Unitario</th>
            <th>Cantidad</th>
            <th>Subtotal</th>
            <th>Acción</th>
          </tr>
        </thead>
        <tbody id="carrito-body">
          <!-- Filas cargadas con JS -->
        </tbody>
      </table>

      <div class="cart-summary">
        <button class="btn-secondary" onclick="vaciarCarrito()">Vaciar Carrito</button>
        <div>
          <span style="font-size:1.3rem; margin-right:15px;">Total: <strong id="carrito-total" style="color:var(--accent);">$0</strong></span>
          <button class="btn-primary" onclick="finalizarCompra()" style="padding:12px 24px;">Finalizar Compra</button>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <p><strong>Sonido Vivo - Tienda de Instrumentos Musicales</strong></p>
    <p>Asignatura: <strong>DSY1104 &ndash; 2026</strong> | Duoc UC</p>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/carrito.js"></script>
</body>
</html>
