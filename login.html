<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="navbar">
    <a href="index.html" class="nav-brand">
      <span class="brand-icon">🎸</span>
      <h1>SONIDO VIVO</h1>
    </a>
    <nav>
      <ul class="nav-list">
        <li><a href="index.html" class="nav-link">Inicio</a></li>
        <li><a href="catalogo.html" class="nav-link">Catálogo</a></li>
        <li><a href="registro.html" class="nav-link">Registro</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <div class="auth-card">
      <h2 class="section-title">Iniciar Ses&oacute;n</h2>
      
      <span class="error-msg" id="error-login-general" style="display:block; text-align:center; font-size:0.95rem; margin-bottom:15px;"></span>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="login-correo">Correo Electr&oacute;nico (@duoc.cl)</label>
          <input type="email" id="login-correo" class="form-control" autocomplete="email">
          <span class="error-msg" id="error-login-correo"></span>
        </div>

        <div class="form-group">
          <label for="login-password">Contrase&ntilde;a</label>
          <input type="password" id="login-password" class="form-control">
          <span class="error-msg" id="error-login-password"></span>
        </div>

        <button type="submit" class="btn-primary" style="width:100%; margin-top:10px;">Ingresar</button>
      </form>

      <p style="text-align:center; margin-top:20px; color:var(--text-muted);">
        &iquest;A&uacute;n no tienes cuenta? <a href="registro.html" style="color:var(--accent); font-weight:bold;">Reg&iacute;strate aqu&iacute;</a>
      </p>
    </div>
  </main>

  <footer>
    <p><strong>Sonido Vivo - Tienda de Instrumentos Musicales</strong></p>
    <p>Asignatura: <strong>DSY1104 &ndash; 2026</strong> | Duoc UC</p>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
